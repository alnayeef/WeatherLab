[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherlab"
version = "0.1.0"
description = "A GrADS-style CLI for decoding SYNOP reports and drawing surface weather charts"
requires-python = ">=3.11"
dependencies = ["requests", "pycountry", "platformdirs", "pandas", "pyarrow", "pymetdecoder"]

[tool.setuptools]
packages = ["weatherlab"]
